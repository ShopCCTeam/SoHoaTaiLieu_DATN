name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # OpenAPI contract validation (chạy trước, fail-fast)
  # =========================================================
  openapi:
    name: OpenAPI Contract Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli

      - name: Lint docs/api/openapi.yaml (RFC 7807 + OpenAPI 3.1)
        run: redocly lint docs/api/openapi.yaml

      # Sau khi FastAPI scaffold xong sẽ thêm step:
      # - name: Generate OpenAPI from FastAPI
      #   run: |
      #     cd apps/api
      #     uv run python -c "from app.main import app; import json; print(json.dumps(app.openapi(), indent=2))" > /tmp/generated.json
      #     # Convert yaml -> json cho cùng format
      #     redocly bundle docs/api/openapi.yaml --output /tmp/contract.json
      #     diff -u /tmp/contract.json /tmp/generated.json
      # để đảm bảo implementation khớp contract (contract-first).

  # =========================================================
  # Frontend quality gate
  # =========================================================
  web:
    name: Web (Next.js) Quality Gate
    runs-on: ubuntu-latest
    defaults:
      working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_MODE: mock

  # =========================================================
  # Backend quality gate (luôn chạy — Phase 0 BE sẽ có pyproject.toml
  # sớm; nếu job luôn skip thì dev sẽ không phát hiện BE lỗi)
  # =========================================================
  api:
    name: API (FastAPI) Quality Gate
    runs-on: ubuntu-latest
    defaults:
      working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Guard pyproject.toml
        run: |
          # working-directory = apps/api, check tương đối với cwd
          if [ ! -f pyproject.toml ]; then
            echo "::error::pyproject.toml chưa tồn tại ở apps/api/pyproject.toml — Phase 0 BE chưa bắt đầu."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy app

      - name: Test (pytest)
        run: uv run pytest --cov=app --cov-report=term-missing

      # DB migration sẽ chạy khi Phase BE có docker-compose
      # - name: Migrate
      #   run: uv run alembic upgrade head
