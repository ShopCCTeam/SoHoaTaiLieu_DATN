name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # OpenAPI contract validation (oasdiff, contract-first)
  # =========================================================
  openapi:
    name: OpenAPI Contract Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@1.15.0

      - name: Lint docs/api/openapi.yaml (RFC 7807 + OpenAPI 3.1)
        run: redocly lint docs/api/openapi.yaml

  # =========================================================
  # Frontend quality gate
  # =========================================================
  web:
    name: Web (Next.js) Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_MODE: mock

  # =========================================================
  # Backend quality gate
  # =========================================================
  api:
    name: API (FastAPI) Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ctsv_test
          POSTGRES_USER: ctsv_test
          POSTGRES_PASSWORD: ctsv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Guard pyproject.toml
        run: |
          if [ ! -f pyproject.toml ]; then
            echo "::error::pyproject.toml not found at apps/api/pyproject.toml"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install uv
        run: pip install uv==0.4.18

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy app

      - name: Alembic upgrade/downgrade on Postgres
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: ctsv_test
          POSTGRES_USER: ctsv_test
          POSTGRES_PASSWORD: ctsv_test
          POSTGRES_TEST_DB: ctsv_test

      # ---------- Coverage: global 80% ----------
      - name: Run tests with coverage (global ≥80%)
        run: |
          uv run pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            -v \
            --tb=short
        env:
          CI: "true"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: ctsv_test
          POSTGRES_USER: ctsv_test
          POSTGRES_PASSWORD: ctsv_test
          POSTGRES_TEST_DB: ctsv_test

      # ---------- Coverage: scoped auth ≥75% ----------
      # Ratchet: = mức đo được 2026-08-11 (75.38%). Nâng dần, không hạ.
      # Xem BACKLOG B1.
      - name: Run tests with coverage (auth ≥75%)
        run: |
          uv run pytest \
            --cov=app.modules.auth \
            --cov-report=term-missing \
            --cov-report=xml:coverage-auth.xml \
            --cov-fail-under=75 \
            --strict-markers \
            -v \
            --tb=short
        env:
          CI: "true"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: ctsv_test
          POSTGRES_USER: ctsv_test
          POSTGRES_PASSWORD: ctsv_test
          POSTGRES_TEST_DB: ctsv_test

      # Note: skipped test gate đã tích hợp vào step coverage qua --strict-markers.
      # Nếu pg_engine không kết nối được Postgres trong CI → pytest.fail (không skip).

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: apps/api/coverage.xml,apps/api/coverage-auth.xml
          fail_ci_if_error: false

      - name: OpenAPI oasdiff (contract vs runtime)
        run: |
          REPO_ROOT="$GITHUB_WORKSPACE"

          # Generate runtime OpenAPI spec from FastAPI app and normalize /api/v1 prefix
          uv run python -c "
          import json, sys
          sys.path.insert(0, '.')
          from app.main import app
          spec = app.openapi()
          spec['paths'] = {k.replace('/api/v1', '', 1) if k.startswith('/api/v1') else k: v for k, v in spec.get('paths', {}).items()}
          with open('$REPO_ROOT/runtime_openapi.json', 'w', encoding='utf-8') as f:
              json.dump(spec, f, indent=2)
          "

          # Diff contract vs runtime — mount qua /repo (ADR D15)
          docker run --rm \
            -v "$REPO_ROOT:/repo" \
            tufin/oasdiff:v1.10.11 \
            diff \
            /repo/docs/api/openapi.yaml \
            /repo/runtime_openapi.json \
            --format json \
            --fail-on-diff \
            --exclude-elements description,summary,examples,title
