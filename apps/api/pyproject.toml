[project]
name = "ctsv-api"
version = "0.1.0"
description = "FastAPI backend for Hệ Thống Số Hoá & Quản Lý Tài Liệu CTSV"
requires-python = ">=3.11,<3.13"
readme = "README.md"
authors = [{ name = "CTSV Datn Team" }]

dependencies = [
    # Web framework
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    # Validation
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    # Auth & security (OWASP 2024: argon2id, không bcrypt)
    "pwdlib[argon2]>=0.3.0,<1",
    "pyjwt>=2.9.0,<3",
    # Database (deferred — actual usage in Phase 1)
    "sqlalchemy>=2.0.36,<3",
    "greenlet>=3.0.0,<4",
    "asyncpg>=0.30.0,<0.31",
    "alembic>=1.13.3,<2",
    "pgvector>=0.3.0,<0.4",
    # Task queue (deferred)
    "celery>=5.4.0,<6",
    "redis>=5.2.0,<6",
    # Object storage
    "boto3>=1.35.0,<2",
    "minio>=7.2.0,<8",            # MinIO S3 storage client (used by MinioStorageService)
    # OCR — PDF→image rendering (pure-Python wheel, no system binary needed)
    "pymupdf>=1.24.0,<2",
        # LangChain RAG orchestration (versions are frozen in uv.lock)
    "langchain>=0.3.0,<0.4",
    "langchain-community>=0.3.0,<0.4",
    "langchain-ollama>=0.2.0,<0.3",
    # HTTP
    "httpx>=0.28.0,<0.29",

    # Utilities
    "python-multipart>=0.0.20,<0.1",
    "orjson>=3.10.0,<4",
    "structlog>=24.4.0,<25",
    "email-validator>=2.2.0,<3",
]

[project.optional-dependencies]
# Real OCR engines. Heavy (paddleocr pulls paddlepaddle); not installed by default.
# CI job `ocr-native` installs this extra for a synthetic dependency/import gate;
# it does not download models or claim PaddleOCR inference coverage. Runtime imports
# in app/services/ocr_engine.py degrade gracefully when the extra is absent.

ocr = [
    "paddlepaddle>=2.6.0,<3",
    "paddleocr>=2.8.0,<3",
    "numpy>=1.26.0,<3",
    "pytesseract>=0.3.10,<0.4",
    "pillow>=10.4.0,<12",
    "setuptools>=69.0.0,<81",
]
dev = [
    "ruff>=0.7.0,<0.8",
    "mypy>=1.13.0,<2",
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "pytest-cov>=5.0.0,<6",
    "httpx>=0.28.0,<0.29",
    "freezegun>=1.5.0,<2",
    "respx>=0.21.0,<0.22",
    "types-passlib>=1.7.7.20240819",
    "aiosqlite>=0.20.0,<0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# -------- Lint (Ruff) --------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ASYNC", # flake8-async
    "S",   # flake8-bandit (security)
    "C4",  # flake8-comprehensions
]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B"]
"alembic/**/*.py" = ["S"]
# FastAPI pattern: Depends() in defaults là idiomatic.
"app/**/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# -------- Type-check (mypy) --------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]
# SQLAlchemy 2.x và Pydantic cần enable some opts
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

# Optional / untyped third-party libs (PDF->image render, OCR engines).
# fitz (PyMuPDF) and Pillow ship no py.typed marker; OCR engines are an
# optional extra not installed in the CI/type-check env.
[[tool.mypy.overrides]]
module = ["cv2", "fitz", "PIL", "PIL.*"]

ignore_missing_imports = true

# -------- pytest --------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
    "-m",
    "not ocr_native",
]
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
    "unit: marks tests as unit (default)",
    "ocr_native: requires the optional native OCR dependencies and system Tesseract binary",
]

# -------- Coverage --------
[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "app/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true
skip_covered = false
